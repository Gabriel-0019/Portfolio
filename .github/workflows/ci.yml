# Continuous integration: .NET tests (PostgreSQL), frontend checks, end-to-end tests and the deployable package.
# Provider-agnostic: deployment is added once the hosting is chosen (see Docs/DEPLOY.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NODE_VERSION: '22'
  # Throw-away PostgreSQL container that only lives for the job. Not a real secret.
  CI_PG: Host=localhost;Port=5432;Username=postgres;Password=ci-only-password

jobs:
  backend:
    name: .NET build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Portfolio.slnx
      - run: dotnet build Portfolio.slnx -c Release --no-restore
      - run: dotnet test Portfolio.slnx -c Release --no-build
        env:
          PORTFOLIO_TEST_PG: ${{ env.CI_PG }}

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/portfolio-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/portfolio-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end and accessibility
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: src/frontend/portfolio-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/portfolio-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          E2E_PG: ${{ env.CI_PG }}
          E2E_BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: src/frontend/portfolio-web/playwright-report
          retention-days: 7

  package:
    name: Deployable package
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/portfolio-web/package-lock.json
      # Builds the React app and the API into one folder (see Portfolio.Api.csproj).
      - run: dotnet publish src/backend/Portfolio.Api -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-site
          path: publish
          retention-days: 30
